{# Bara de sus: cautare HTMX + comutator de tema + utilizator. Variabile: user. #}
<header class="topbar">
  <input class="search" type="search" name="q" placeholder="Caută un proiect…" data-i18n-ph="search-ph"
         hx-get="/proiecte/cauta"
         hx-trigger="keyup changed delay:300ms, search"
         hx-target="#project-list"
         hx-swap="innerHTML"
         aria-label="Caută un proiect">

  {# Comutator de limbă #}
  <div class="lang-toggle" role="group" aria-label="Limbă / Language">
    <button class="lang-btn" type="button" data-lang-set="ro" aria-pressed="true">RO</button>
    <button class="lang-btn" type="button" data-lang-set="en" aria-pressed="false">EN</button>
  </div>

  {# Comutator de tema: doua butoane, starea activa marcata prin aria-pressed. #}
  <div class="theme-toggle" role="group" aria-label="Temă">
    <button class="theme-btn" type="button" data-theme-set="light"
            title="Temă luminoasă" aria-label="Temă luminoasă" aria-pressed="false">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="3.1" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 1.2v1.6M8 13.2v1.6M14.8 8h-1.6M2.8 8H1.2M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1M12.8 12.8l-1.1-1.1M4.3 4.3L3.2 3.2"
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="theme-btn" type="button" data-theme-set="dark"
            title="Temă întunecată" aria-label="Temă întunecată" aria-pressed="false">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M13.5 9.6A5.8 5.8 0 016.4 2.5a5.8 5.8 0 107.1 7.1z"
              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="user">
    <span class="avatar">{{ user.initials() }}</span>
    <span class="user-name">{{ user.name }}</span>
    <form method="post" action="/logout">
      <button class="logout-btn" type="submit" title="Deconectare" aria-label="Deconectare">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6.5 14H3.5C2.94772 14 2.5 13.5523 2.5 13V3C2.5 2.44772 2.94772 2 3.5 2H6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10.5 11.5L14 8L10.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 8H6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>
</header>

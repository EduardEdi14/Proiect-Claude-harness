<!DOCTYPE html>
<html lang="ro" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · Libra Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/app.css">
<script>
/* Tema se aplica inainte de prima randare, ca pagina sa nu clipeasca alb la incarcare.
   Fara valoare salvata ramane gol, iar CSS-ul urmeaza preferinta sistemului. */
(function(){try{var t=localStorage.getItem("lm-theme");
document.documentElement.setAttribute("data-theme",t==="dark"||t==="light"?t:"");}catch(e){}})();
</script>
<script src="/static/js/htmx.min.js" defer></script>
<script src="/static/js/app.js" defer></script>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>

version: "3.9"
# docker-compose.node.yml — serverul Node.js al Libra Maker.
# Folosit de TOTI colegii.
#
# Pornire colegi (se conecteaza la baza de date de pe laptopul lui Ioana):
#   docker compose -f docker-compose.node.yml up -d
#
# Pornire Ioana (ruleaza si baza de date):
#   docker compose -f docker-compose.node.db.yml up -d
#   docker compose -f docker-compose.node.yml up -d

services:
  web:
    build:
      context: .
      dockerfile: backend/node/Dockerfile
    image: libra-maker-node:latest
    ports:
      - "3000:8080"
    environment:
      PORT: "8080"
      NODE_ENV: "development"
      SESSION_SECRET: "libra-maker-secret-schimba-in-productie"
      BUILD_DELAY_MS: "2500"
      # Pe laptopul lui Ioana: host.docker.internal (adresa hostului din container)
      # Pe laptopul colegilor: inlocuieste cu IP-ul lui Ioana (192.168.149.147)
      DATABASE_URL: "postgresql://libramaker:libramaker2025@harness-db-1:5432/libramaker"
    volumes:
      - ./frontend/templates-njk:/frontend/templates-njk:ro
      - ./frontend/static:/frontend/static:ro
      - libra_workspaces:/app/workspaces
    restart: unless-stopped

volumes:
  libra_workspaces:

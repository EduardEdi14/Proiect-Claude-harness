version: "3.9"
# docker-compose.node.yml — serverul Node.js al Libra Maker.
# Folosit de TOTI colegii. Configureaza DATABASE_URL in fisierul .env din acelasi director.
#
# Ioana (serverul cu baza de date):
#   DATABASE_URL=postgresql://libramaker:libramaker2025@harness-db-1:5432/libramaker
#
# Colegi (se conecteaza la baza lui Ioana):
#   DATABASE_URL=postgresql://libramaker:libramaker2025@192.168.149.147:5432/libramaker
#
# Pornire: docker compose -f docker-compose.node.yml up -d

services:
  web:
    build:
      context: .
      dockerfile: backend/node/Dockerfile
    image: libra-maker-node:latest
    ports:
      - "3000:8080"
    env_file:
      - backend/node/.env
    volumes:
      - ./frontend/templates-njk:/frontend/templates-njk:ro
      - ./frontend/static:/frontend/static:ro
      - libra_workspaces:/app/workspaces
    restart: unless-stopped

volumes:
  libra_workspaces:
